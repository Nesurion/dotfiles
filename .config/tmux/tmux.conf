# ── Prefix ────────────────────────────────────────────────────────────────────
set -g prefix C-b
bind C-b send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g escape-time 0
set -g focus-events on
set -g mouse on
set -sg extended-keys on
set -as terminal-features 'xterm-256color:RGB'
set -g default-terminal "tmux-256color"

# ── Window/Pane numbering ─────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Splits ────────────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation (ALT+hjkl, mirrors WezTerm) ───────────────────────────────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ── Pane resizing (prefix + hjkl, repeatable) ────────────────────────────────
bind -r h resize-pane -L 10
bind -r j resize-pane -D 10
bind -r k resize-pane -U 10
bind -r l resize-pane -R 10

# ── Zoom (ALT+Enter, mirrors WezTerm) ─────────────────────────────────────────
bind -n M-Enter resize-pane -Z

# ── Swap panes (prefix+p, mirrors WezTerm LEADER+p) ──────────────────────────
bind p display-panes \; command-prompt -p "Swap with pane #:" "swap-pane -t '%%'"

# ── Copy mode (vi-style, prefix+c mirrors WezTerm LEADER+c) ──────────────────
setw -g mode-keys vi
bind c copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ── Scroll (PageUp/PageDown mirrors WezTerm) ──────────────────────────────────
bind -n PageUp copy-mode \; send -X halfpage-up
bind -n PageDown copy-mode \; send -X halfpage-down

# ── Mouse scroll speed (1 line per tick in copy mode) ─────────────────────────
bind -n WheelUpPane if -F "#{mouse_any_flag}" "send -M" "if -F '#{pane_in_mode}' 'send -M' 'copy-mode -e'"
bind -n WheelDownPane if -F "#{mouse_any_flag}" "send -M" "send -M"
bind -T copy-mode-vi WheelUpPane send -N1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N1 -X scroll-down

# ── Session switcher (Option+T) ───────────────────────────────────────────────
bind -n M-t display-popup -E -w 60% -h 50% "$HOME/.local/bin/tmux-switch"

# ── Switch to last session (Option+Ctrl+T)
bind -n M-C-t run-shell "$HOME/.local/bin/tmux-switch --last"

# ── New named session
bind -n C-T command-prompt -p "New session name:" "new-session -s '%%' -c '#{pane_current_path}'"

# ── Close pane (CMD+w not available in tmux; use prefix+x) ───────────────────
bind x kill-pane

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ── Status bar — Oasis ────────────────────────────────────────────────────────
set -g @oasis_flavor 'lagoon_dark'
set -g @oasis_module_clock ""

# ── TPM plugins ───────────────────────────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @fzf-url-bind 'u'

# FloaX configuration
set -g @floax-bind 't'
set -g @floax-bind-menu 'T'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#82aaff'
set -g @floax-text-color '#c8d3f5'

set -g @tpm-clean 'U'

run '~/.tmux/plugins/tpm/tpm'
